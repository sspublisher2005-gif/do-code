name: Docode Windows Sandbox Matrix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sandbox-matrix-windows.yml"
      - "scripts/sandbox_adversarial_windows.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/sandbox-matrix-windows.yml"
      - "scripts/sandbox_adversarial_windows.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: docode-sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-matrix:
    name: Windows sandbox adversarial matrix
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Build docode (release)
        run: cargo build --release --locked
        shell: pwsh

      - name: Run sandbox adversarial matrix (disposable native runner)
        run: python scripts/sandbox_adversarial_windows.py --binary target\release\docode.exe --report sandbox-adversarial.json --execute-matrix --case-timeout 120
        shell: pwsh

      - name: Upload sandbox evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-adversarial-${{ github.sha }}
          path: sandbox-adversarial.json
          if-no-files-found: warn
          retention-days: 90

      - name: Release gate on matrix status
        if: always()
        shell: pwsh
        run: |
          $reportPath = "sandbox-adversarial.json"
          if (-not (Test-Path $reportPath)) {
            Write-Error "Sandbox report was not created: $reportPath"
            exit 1
          }

          $report = Get-Content -Raw $reportPath | ConvertFrom-Json
          $status = [string]$report.status
          Write-Host "status=$status"

          foreach ($case in $report.executed) {
            $id = [string]$case.id
            $result = if ($case.passed) { "PASS" } else { "FAIL" }
            Write-Host "$id=$result"
          }

          if ($status -ne "WINDOWS_SUBSET_PASS" -and $status -ne "PASS") {
            Write-Error "Sandbox matrix did not pass: status=$status"
            exit 1
          }

          $failed = @($report.executed | Where-Object { -not $_.passed })
          if ($failed.Count -gt 0) {
            Write-Error "One or more sandbox matrix cases failed."
            exit 1
          }

          Write-Host "Windows sandbox matrix release gate passed."
