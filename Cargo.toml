[package]
name = "docode-cli"
version = "0.7.0-rs.1"
edition = "2024"
rust-version = "1.88"
description = "Docode coding harness implemented in Rust"
license = "MIT"
readme = "README.md"
build = "build.rs"

[[bin]]
name = "docode"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "help", "usage", "error-context", "std"] }
fs2 = "0.4.3"
libc = "0.2"
regex = "1.12"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "time", "net", "io-util"] }
toml = "0.9.8"
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Optional: `cargo build --profile small` when download size matters more than peak speed.
[profile.small]
inherits = "release"
opt-level = "z"
lto = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_JobObjects"] }
